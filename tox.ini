[tox]
envlist = py310,py311,py312,py313
requires =
    setuptools

[testenv]
deps =
    rcon
    psutil
commands =
    python -c "import valveexe; print(valveexe.__name__, 'imported OK')"

[testenv:docs]
basepython = python3.13
deps =
    sphinx
commands =
    python -m sphinx docs/source/ docs/build/
